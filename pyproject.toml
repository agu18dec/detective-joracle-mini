[project]
name = "joracle-mini"
version = "0.1.0"
description = "A minimal investigator agent that explains why a language model behaves a certain way, with and without activation readouts."
requires-python = ">=3.11"
dependencies = ["openai>=1.40"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
